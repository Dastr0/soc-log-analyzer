# CSV Column Mapping — atur sendiri mapping kolom CSV ke field standar.
#
# Format: "nama_kolom_di_CSV_export_Elastic": "nama_field_standar"
#
# Script auto-detect source dari nama kolom CSV, lalu pakai mapping di sini.
# Mapping yang nggak ada di sini: tetep masuk sebagai field asli (tidak hilang).
# Mapping di bawah ini adalah DEFAULT — lu bisa tambahin/ganti sesuai format
# export Elastic Discover lu sendiri.

# ── Wazuh HIDS ─────────────────────────────────────────────────────
wazuh:
  "@timestamp": "timestamp"
  ts: "timestamp"
  rule_id: "rule.id"
  rule.level: "rule.level"
  rule_level: "rule.level"
  rule.description: "rule.description"
  rule_description: "rule.description"
  rule.groups: "rule.groups"
  agent_id: "agent.id"
  agent_name: "agent.name"
  agent_ip: "agent.ip"
  manager_name: "manager.name"
  data_srcip: "data.srcip"
  src_ip: "data.srcip"
  data_srcport: "data.srcport"
  srcport: "data.srcport"
  data_srcuser: "data.srcuser"
  data_dstuser: "data.dstuser"
  data_dstip: "data.dstip"
  dst_ip: "data.dstip"
  data_dstport: "data.dstport"
  dstport: "data.dstport"
  data_proto: "data.proto"
  data_command: "data.command"
  data_id: "data.id"
  location: "location"
  full_log: "full_log"
  message: "full_log"
  predecoder_program_name: "predecoder.program_name"

